<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persona Assets</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <div class="relative overflow-hidden">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top,#262626,transparent_55%)]"></div>
    <div class="relative flex w-full flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <header class="flex flex-col gap-4 rounded-lg border border-neutral-800/70 bg-neutral-900/70 p-5 shadow-lg shadow-black/30 backdrop-blur">
        <div class="flex flex-wrap items-start justify-between gap-6">
          <div>
            <p class="text-[11px] uppercase tracking-[0.2em] text-neutral-400">Minecraft Bedrock</p>
            <h1 class="mt-2 text-2xl font-semibold text-white sm:text-3xl">Persona Assets</h1>
            <p class="mt-1.5 text-xs text-neutral-400"><span id="updatedAt">Updated: —</span> • <span id="counts">—</span></p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="rounded-lg border border-neutral-700/80 bg-neutral-900/80 px-3 py-1.5 text-xs font-medium text-neutral-100" id="count">—</span>
            <a class="inline-flex items-center gap-2 rounded-lg border border-neutral-800 bg-neutral-900/60 px-3 py-1.5 text-xs font-medium text-neutral-200 transition hover:border-neutral-500 hover:text-white" href="./data/persona_emote/items.json" target="_blank" rel="noreferrer">Emotes JSON</a>
            <a class="inline-flex items-center gap-2 rounded-lg border border-neutral-800 bg-neutral-900/60 px-3 py-1.5 text-xs font-medium text-neutral-200 transition hover:border-neutral-500 hover:text-white" href="./data/persona_piece/items.json" target="_blank" rel="noreferrer">Pieces JSON</a>
          </div>
        </div>
      </header>

      <section class="rounded-lg border border-neutral-800/70 bg-neutral-900/70 p-5 shadow-lg shadow-black/30 backdrop-blur">
        <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6">
          <input id="q" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white placeholder:text-neutral-500 focus:border-neutral-400 focus:outline-none xl:col-span-2" placeholder="Search title, uuid, creator, keywords..." />
          <select id="type" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white focus:border-neutral-400 focus:outline-none">
            <option value="all">All types</option>
            <option value="persona_emote">persona_emote</option>
            <option value="persona_piece">persona_piece</option>
          </select>
          <select id="rarity" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white focus:border-neutral-400 focus:outline-none"></select>
          <select id="creator" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white focus:border-neutral-400 focus:outline-none"></select>
          <select id="purchasable" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white focus:border-neutral-400 focus:outline-none">
            <option value="all">Purchasable: any</option>
            <option value="true">Purchasable: yes</option>
            <option value="false">Purchasable: no</option>
          </select>
        </div>

        <div class="mt-4 flex flex-wrap items-center justify-between gap-4">
          <p class="text-[11px] text-neutral-400">Tip: sort by last modified to catch new updates quickly.</p>
          <div class="w-full sm:w-72">
            <select id="sort" class="h-10 w-full rounded-lg border border-neutral-800 bg-neutral-950/70 px-3 text-sm text-white focus:border-neutral-400 focus:outline-none">
              <option value="title_asc">Sort: Title (A→Z)</option>
              <option value="title_desc">Sort: Title (Z→A)</option>
              <option value="modified_desc">Sort: LastModifiedDate (newest)</option>
              <option value="start_desc">Sort: StartDate (newest)</option>
              <option value="price_asc">Sort: Price (low→high)</option>
              <option value="price_desc">Sort: Price (high→low)</option>
            </select>
          </div>
        </div>

        <div id="grid" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5"></div>

        <div class="mt-5 flex flex-wrap justify-between gap-3 text-[11px] text-neutral-400">
          <span>Data source: PlayFab Economy v2 Catalog/Search</span>
          <span>UI shows up to 2000 results — use filters to narrow.</span>
        </div>
      </section>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
